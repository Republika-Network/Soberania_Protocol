<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!--
  Soberanía Protocol Open Graph card (v2). Laid out at 1200x630 CSS px and
  rendered at 2x by render.mjs. Artwork, mark and type are the site's own:
  src/assets/soberania/soberania-hero-mirror.webp, public/favicon-soberania.svg,
  Fraunces + Figtree (fonts/, SIL OFL 1.1). See README.md.
-->
<style>
  @font-face { font-family: 'Fraunces'; font-weight: 300 500; src: url(fonts/Fraunces-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Figtree'; font-weight: 400 600; src: url(fonts/Figtree-latin.woff2) format('woff2'); }
  html, body { margin: 0; padding: 0; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: #0a0918; color: #f4f1fa; font-family: 'Figtree', sans-serif;
  }
  /* Official hero artwork: the luminous boundary and the amethyst reflection. */
  .art {
    position: absolute; top: 0; height: 630px; left: -175px;
  }
  /* Darken the left so the human subject recedes and type sits on near-solid ink. */
  .veil {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, #0a0918 0%, #0a0918 46%, rgba(10,9,24,.88) 56%, rgba(10,9,24,.35) 66%, rgba(10,9,24,0) 74%),
      linear-gradient(0deg, rgba(10,9,24,.55) 0%, rgba(10,9,24,0) 22%),
      linear-gradient(270deg, rgba(10,9,24,.92) 0%, rgba(10,9,24,.6) 6%, rgba(10,9,24,0) 13%);
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 660px; display: flex; flex-direction: column; }
  .brand { margin-top: 64px; display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 46px; height: 58px; }
  .brand span { font-family: 'Fraunces', serif; font-weight: 400; font-size: 34px; letter-spacing: -0.01em; color: #fff; }
  h1 {
    margin: auto 0 0; font-family: 'Fraunces', serif; font-weight: 400;
    font-size: 74px; line-height: 1.04; letter-spacing: -0.025em; color: #fff;
  }
  h1 em { font-style: normal; background: linear-gradient(175deg, #d6c2ff 0%, #a985f0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 em.b { background-image: linear-gradient(175deg, #f6d0f4 0%, #d4a4ef 100%); }
  .rule { margin-top: 34px; width: 84px; height: 2px; background: linear-gradient(90deg, #c9a8f7, rgba(201,168,247,0)); }
  .sub {
    margin: 22px 0 72px; font-size: 29px; font-weight: 500; letter-spacing: 0.01em;
    color: rgba(232, 226, 246, 0.92); white-space: nowrap;
  }
  .sub i { font-style: normal; color: #b48cf5; padding: 0 10px; }
</style>
</head>
<body>
<div class="card">
  <img class="art" src="../../src/assets/soberania/soberania-hero-mirror.webp" alt="" />
  <div class="veil"></div>
  <div class="copy">
    <div class="brand">
      <!-- Soberanía mark: geometry and Amethyst ramp from public/favicon-soberania.svg -->
      <svg viewBox="8 -0.5 80 116" aria-hidden="true">
        <defs>
          <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3EAFF"/><stop offset=".4" stop-color="#C79BFF"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
          <linearGradient id="b" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4DBFF"/><stop offset=".5" stop-color="#9B6BFA"/><stop offset="1" stop-color="#4C1D95"/></linearGradient>
          <linearGradient id="c" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#5B21B6"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EBDDFF"/></linearGradient>
        </defs>
        <path d="M10 28 32 15 32 43 10 56Z" fill="url(#a)"/>
        <path d="M32 15 57 1 57 29 32 43Z" fill="url(#b)"/>
        <path d="M61 38 86 52 86 80 61 66Z" fill="url(#a)"/>
        <path d="M12 59 36 45 60 58 36 72Z" fill="url(#c)"/>
        <path d="M12 80 36 66 60 79 36 93Z" fill="url(#b)"/>
        <path d="M61 72 86 86 86 114 61 100Z" fill="url(#a)"/>
      </svg>
      <span>Soberanía Protocol</span>
    </div>
    <h1>Digital <em>Sovereignty.</em><br />Programmable <em class="b">Trust.</em></h1>
    <div class="rule"></div>
    <p class="sub">Consent<i>·</i>Delegated Authority<i>·</i>Verifiable Evidence</p>
  </div>
</div>
</body>
</html>
